task: |
  In pkg/image/cache.go, the computeHash function generates a cache key for image
  architecture lookups. The cache key must uniquely identify an (imageReference, pullSecret)
  pair so that different images or different credentials never collide in the LRU cache.

  The function currently uses FNV-128 (a non-cryptographic, fast hash):

    func computeHash(imageReference string, secrets []byte) string {
        h := fnv.New128()
        h.Write([]byte(imageReference))
        h.Write(secrets)
        return hex.EncodeToString(h.Sum(nil))
    }

  FNV-128 is not collision-resistant. With only 128 bits of output and no separator between
  imageReference and secrets, two different (imageReference, secrets) pairs can produce the
  same hash. A cache collision causes the architecture set for one image to be returned for
  a different image, leading to incorrect node affinity placement.

  Rewrite computeHash to use SHA-256 and include a null byte separator between imageReference
  and secrets to prevent boundary confusion (hash("ab" + "c") == hash("a" + "bc")):

    func computeHash(imageReference string, secrets []byte) string {
        h := sha256.New()
        h.Write([]byte(imageReference))
        h.Write([]byte{0})
        h.Write(secrets)
        return hex.EncodeToString(h.Sum(nil))
    }

  Update imports: replace "hash/fnv" with "crypto/sha256".
task_id: mto-010-cache-hash-sha256
